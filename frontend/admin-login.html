<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="admin-login-container">

    <form class="admin-login-form"
          onsubmit="adminLogin(event)">

        <h1>

            Admin Login

        </h1>

        <input
            type="email"
            id="adminEmail"
            placeholder="Enter Admin Email"
            required
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password"
            required
        >

        <button type="submit">

            Login

        </button>

    </form>

</div>


<script>

async function adminLogin(e){

    e.preventDefault();

    const email =

    document.getElementById(
        "adminEmail"
    ).value;


    const password =

    document.getElementById(
        "adminPassword"
    ).value;


    const response = await fetch(

        "http://127.0.0.1:8000/api/admin-login/",

        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                email,
                password

            })

        }

    );


    const result =
    await response.json();


    if(result.error){

        alert(result.error);

    }

    else{

        alert(result.message);

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        window.location.href =

        "admin-dashboard.html";

    }

}

</script>

</body>

</html>
